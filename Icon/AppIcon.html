<!doctype html>
<!-- Notity app icon. Source of truth for Resources/AppIcon.icns: regenerate with scripts/make-icon.sh.
     Two stacked notes (copy twice → kept): the front one has text lines. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notity icon</title>
<style>
html, body { margin: 0; background: transparent; }
.icon { width: 1024px; height: 1024px; position: relative; }
.squircle { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: linear-gradient(160deg, #4A7BF0 0%, #3566E0 55%, #2A52B8 100%);
  overflow: hidden; box-shadow: 0 18px 36px rgba(0,0,0,0.32); }
.note { position: absolute; width: 400px; height: 480px; border-radius: 56px; }
.back { left: 254px; top: 150px; background: rgba(255,255,255,0.42); transform: rotate(-9deg); }
.front { left: 230px; top: 200px; background: #FFFFFF; box-shadow: 0 26px 52px rgba(8,14,40,0.35); }
.line { position: absolute; left: 300px; height: 34px; border-radius: 17px; background: #3566E0; }
</style>
</head>
<body>
<div class="icon"><div class="squircle">
  <div class="note back"></div>
  <div class="note front"></div>
  <div class="line" style="top: 298px; width: 260px;"></div>
  <div class="line" style="top: 374px; width: 220px; opacity: .55"></div>
  <div class="line" style="top: 450px; width: 240px; opacity: .55"></div>
  <div class="line" style="top: 526px; width: 140px; opacity: .55"></div>
</div></div>
</body>
</html>
